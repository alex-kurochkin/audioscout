[workspace]
members = [
    "audioscout-core",
    "audioscout-app",
    # "waveform-preview",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
crossbeam-channel = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
