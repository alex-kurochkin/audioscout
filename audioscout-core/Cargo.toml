[package]
name = "audioscout-core"
version.workspace = true
edition.workspace = true

[features]
default = []
testing = []

[dependencies]
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
lofty = "0.21"
rustfft = "6.2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
tempfile = "3.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
crossbeam-channel = "0.5"
uuid = { version = "1.11", features = ["v4"] }
dirs-next = "2.0"
thiserror = "2.0"
anyhow = "1.0"
image = "0.25"

[dev-dependencies]
tempfile = "3.14"
