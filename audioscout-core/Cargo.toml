[package]
name = "audioscout-core"
version.workspace = true
edition.workspace = true

[features]
default = []
testing = []

[dependencies]
# Audio
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
lofty = "0.21"

# FFT
rustfft = "6.2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File system
walkdir = "2.5"
tempfile = "3.14"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = "0.2"

# Concurrency
crossbeam-channel = { workspace = true }

# UUID
uuid = { version = "1.11", features = ["v4"] }

# Directories
dirs-next = "2.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Image rendering
image = "0.25"

# Date/time
chrono = "0.4"

# System info (disks)
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3.14"
