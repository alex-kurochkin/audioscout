[package]
name = "audioscout-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "audioscout"
path = "src/main.rs"

[features]
default = []
testing = ["audioscout-core/testing"]

[dependencies]
audioscout-core = { path = "../audioscout-core" }

# UI
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"

# Dialogs
rfd = "0.15"

# Logging
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = "0.3"

# Concurrency
crossbeam-channel = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Directories
dirs-next = "2.0"

# Date/time
chrono = "0.4"

# Image processing
image = "0.25"
