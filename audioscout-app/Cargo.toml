[package]
name = "audioscout-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "audioscout"
path = "src/main.rs"

[features]
default = []
testing = ["audioscout-core/testing"]

[dependencies]
audioscout-core = { path = "../audioscout-core" }
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
rfd = "0.15"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
